
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kæledyrsfotos</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 24px;
  background: #323D4F;
  color: white;
  text-align: center;
}

h1 {
  margin-bottom: 25px;
}

.slideshow {
  max-width: 850px;
  margin: 25px auto;
  background: #394658;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #00000030;
}

.billede {
  width: 100%;
  height: 480px;
  object-fit: contain;
  border-radius: 12px;
  background: #202a38;
}

.billedtekst {
  font-size: 22px;
  font-weight: bold;
  margin: 18px 0;
  color: white;
}

.knapper {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.knapper button {
  padding: 13px 22px;
  border: none;
  border-radius: 10px;
  background: #00A09A;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.knapper button:active {
  transform: scale(0.95);
}

.tilbage {
  display: inline-block;
  margin-top: 25px;
  color: white;
  font-size: 17px;
}

@media (max-width: 600px) {
  .billede {
    height: 330px;
  }
}
</style>
</head>

<body>

<h1>Kæledyrsfotos</h1>

<div class="slideshow">

  <img id="foto" class="billede" src="" alt="Kæledyr">

  <div id="billedtekst" class="billedtekst"></div>

  <div class="knapper">
    <button onclick="forrige()">← Forrige</button>
    <button onclick="naeste()">Næste →</button>
  </div>

  <p id="nummer"></p>

</div>

<a class="tilbage" href="index.html">
  ← Tilbage til forsiden
</a>

<script>

// DINE BILLEDFILNAVNE
const billeder = [
  "Anna_Molly_001.jpeg",
  "Anna_Molly_002.jpeg",
  "Anna_Molly_003.jpeg",
  "Anna_Molly_004.jpeg",
  "Anonym - Milo.png",
  "Anonym - Dolly.png",
  "Anonym_Milo_001.jpeg",
  "Carla_Sigga_002.jpeg",
  "Carla_Sigga_003.jpeg",
  "Carla_Sigga_004.jpeg",
  "Carla_Sigga_005.jpeg",
  "Carla_Sigga_006.jpeg",
  "Caroline_Zivas_001.jpeg",
  "Caroline_Zivas_002.jpeg",
  "Caroline_Zivas_003.jpeg",
  "Caroline_Zivas_004.jpeg",
  "Caroline_Zivas_005.jpeg",
  "Caroline_Zivas_006.jpeg",
  "Ditte - Bonushunden.jpeg",
  "Ditte - Goedbadl.png",
  "Elias_Jack_001.jpg",
  "Oliver - Duchess.png",
  "Oliver_Duchess_001.jpeg",
  "Oliver_Duchess_002.jpeg",
  "Oliver_Duchess_004.jpeg",
  "Oliver_Duchess_006.jpeg",
  "Oliver_Duchess_007.jpeg",
  "Oliver_Prins_002.jpeg",
  "Oliver_Prins_003.jpeg",
  "Pernille_Frida_001.jpg",
  "Peter_Rotterøv_001.jpeg",
  "Peter_Tykkemis_001.jpeg"
];

let aktuel = 0;

function visBillede() {

  const fil = billeder[aktuel];

  const billedmappe =
    "https://raw.githubusercontent.com/anna262f-alt/infoskaerm/main/k%C3%A6ledyrsbilleder/";

  const foto = document.getElementById("foto");

  foto.src = billedmappe + encodeURIComponent(fil);

  let navn = fil.replace(/\.(jpeg|jpg|png)$/i, "");

// Fjern tallet til sidst
navn = navn.replace(/[_\s-]*\d+$/, "");

// Erstat understregninger med mellemrum
navn = navn.replace(/_/g, " ");

// Ryd op i mellemrum
navn = navn.trim().replace(/\s+/g, " ");

// Sørg for bindestreg mellem ejer og kæledyr
if (!navn.includes(" - ") && !navn.includes(" – ")) {
  navn = navn.replace(" ", " - ");
}

// Brug samme pæne bindestreg hver gang
navn = navn.replace(/\s*[-–]\s*/, " – ");

  document.getElementById("billedtekst").textContent = navn;

  document.getElementById("nummer").textContent =
    (aktuel + 1) + " / " + billeder.length;
}

function naeste() {
  aktuel = (aktuel + 1) % billeder.length;
  visBillede();
}

function forrige() {
  aktuel = (aktuel - 1 + billeder.length) % billeder.length;
  visBillede();
}

visBillede();

</script>

</body>
</html>

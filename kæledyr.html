<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kæledyrsfotos</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 24px;
  background: #323D4F;
  color: white;
  text-align: center;
}

h1 {
  margin-bottom: 25px;
}

.slideshow {
  max-width: 850px;
  margin: 25px auto;
  background: #394658;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #00000030;
}

.billede {
  width: 100%;
  height: 480px;
  object-fit: contain;
  border-radius: 12px;
  background: #202a38;
}

.billedtekst {
  font-size: 22px;
  font-weight: bold;
  margin: 18px 0;
  color: white;
}

.knapper {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

.knapper button {
  padding: 13px 22px;
  border: none;
  border-radius: 10px;
  background: #00A09A;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.knapper button:active {
  transform: scale(0.95);
}

.knapper button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.tilbage {
  display: inline-block;
  margin-top: 25px;
  color: white;
  font-size: 17px;
}

@media (max-width: 600px) {
  .billede {
    height: 330px;
  }
}

   /* Automatisk tilbagefunktion */

.inaktiv-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.75);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.inaktiv-overlay.vis {
  display: flex;
}

.inaktiv-vindue {
  position: relative;
  width: 90%;
  max-width: 500px;
  padding: 35px 25px 45px;
  background: var(--panel, #394658);
  border: 2px solid var(--turquoise, #00A09A);
  border-radius: 18px;
  text-align: center;
  color: var(--turquoise, #00A09A);
  overflow: hidden;
}

.inaktiv-vindue h2 {
  margin-top: 0;
  font-size: 25px;
}

.inaktiv-vindue p {
  font-size: 17px;
  line-height: 1.5;
}

.inaktiv-knap {
  margin-top: 15px;
  padding: 14px 22px;
  border: none;
  border-radius: 10px;
  background: var(--turquoise, #00A09A);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.inaktiv-streg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,0.2);
}

.inaktiv-streg-indhold {
  width: 100%;
  height: 100%;
  background: var(--turquoise, #00A09A);
  transform-origin: left;
}

.inaktiv-overlay.vis .inaktiv-streg-indhold {
  animation: inaktivNedtaelling 10s linear forwards;
}

@keyframes inaktivNedtaelling {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}

/* Tilpas kæledyrssiden til skærmens størrelse */

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  height: 100vh;
  height: 100dvh;
  padding: 24px;
  overflow: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Overskriften */

h1 {
  flex-shrink: 0;
  margin: 0 0 25px;
}

/* Selve billedfeltet */

.slideshow {
  width: 100%;
  max-width: 850px;

  flex: 1;
  min-height: 0;

  margin: 0 auto;
  padding: 18px;

  display: flex;
  flex-direction: column;
}

/* Billedet bevarer sine proportioner */

.billede {
  width: 100%;
  height: 480px;

  flex: 1 1 480px;
  min-height: 0;

  object-fit: contain;
}

/* Billedteksten */

.billedtekst {
  flex-shrink: 0;
  margin: 18px 0;
}

/* Knapperne */

.knapper {
  flex-shrink: 0;
  flex-wrap: wrap;
  justify-content: center;
}

/* Nummer og tilbageknap */

#nummer {
  flex-shrink: 0;
}

.tilbage {
  flex-shrink: 0;
  margin-top: 25px;
}

/* Tilpasning ved zoom og mindre skærmhøjde */

@media (max-height: 800px) {
  body {
    padding: 10px;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 24px;
  }

  .slideshow {
    padding: 10px;
    margin: 0 auto;
  }

  .billede {
    flex-basis: 0;
    height: 0;
  }

  .billedtekst {
    margin: 8px 0;
    font-size: 18px;
  }

  .knapper {
    gap: 8px;
  }

  .knapper button {
    padding: 10px 14px;
    font-size: 14px;
  }

  .tilbage {
    margin-top: 10px;
    font-size: 14px;
  }
}

/* Tilpasning ved meget høj zoom */

@media (max-height: 500px) {
  body {
    padding: 5px;
  }

  h1 {
    margin-bottom: 5px;
    font-size: 18px;
  }

  .slideshow {
    padding: 5px;
  }

  .billedtekst {
    margin: 4px 0;
    font-size: 14px;
  }

  .knapper {
    gap: 5px;
  }

  .knapper button {
    padding: 6px 10px;
    font-size: 12px;
  }

  #nummer {
    margin: 5px 0;
    font-size: 12px;
  }

  .tilbage {
    margin-top: 5px;
    font-size: 12px;
  }
}

@media (max-height: 760px) {
  .tilbage {
    display: inline-block;
    flex-shrink: 0;
    margin-top: 8px;
    margin-bottom: 4px;
  }

  body {
    padding-bottom: 8px;
  }
}
</style>
</head>

<body>

<div class="slideshow">

  <img id="foto" class="billede" src="" alt="Kæledyr">

  <div id="billedtekst" class="billedtekst"></div>

  <div class="knapper">
  <button onclick="forrige()">← Forrige</button>

  <button id="pauseKnap" onclick="pauseSlideshow()">
    ⏸ Pause
  </button>

  <button onclick="naeste()">Næste →</button>
</div>
  <p id="nummer"></p>

</div>

<a class="tilbage" href="index.html">
  ← Tilbage til forsiden
</a>

<!-- Automatisk tilbagefunktion -->

<div class="inaktiv-overlay" id="inaktivOverlay">
  <div class="inaktiv-vindue">

    <h2>Er du her stadig?</h2>

    <p>
      Hvis du vil blive på siden, skal du trykke på knappen nedenfor.
      Ellers vender skærmen automatisk tilbage til forsiden.
    </p>

    <button class="inaktiv-knap" onclick="blivPaaSiden()">
      Jeg vil blive på siden
    </button>

    <div class="inaktiv-streg">
      <div class="inaktiv-streg-indhold"></div>
    </div>

  </div>
</div>

<script>

// DINE BILLEDFILNAVNE
const billeder = [
  "Anna_Molly_001.jpeg",
  "Anna_Molly_002.jpeg",
  "Anna_Molly_003.jpeg",
  "Anna_Molly_004.jpeg",
  "Anonym - Milo.png",
  "Anonym - Dolly.png",
  "Anonym_Milo_001.jpeg",
  "Carla_Sigga_002.jpeg",
  "Carla_Sigga_003.jpeg",
  "Carla_Sigga_004.jpeg",
  "Carla_Sigga_005.jpeg",
  "Carla_Sigga_006.jpeg",
  "Caroline_Zivas_001.jpeg",
  "Caroline_Zivas_002.jpeg",
  "Caroline_Zivas_003.jpeg",
  "Caroline_Zivas_004.jpeg",
  "Caroline_Zivas_005.jpeg",
  "Caroline_Zivas_006.jpeg",
  "Ditte - Bonushunden.jpeg",
  "Ditte - Goedbadl.png",
  "Elias_Jack_001.jpg",
  "Oliver - Duchess.png",
  "Oliver_Duchess_001.jpeg",
  "Oliver_Duchess_002.jpeg",
  "Oliver_Duchess_004.jpeg",
  "Oliver_Duchess_006.jpeg",
  "Oliver_Duchess_007.jpeg",
  "Oliver_Prins_002.jpeg",
  "Oliver_Prins_003.jpeg",
  "Pernille_Frida_001.jpg",
  "Peter_Rotterøv_001.jpeg",
  "Peter_Tykkemis_001.jpeg"
];

let aktuel = 0;
let raekkefoelge = [];
let visteBilleder = new Set();

function blandBilleder() {
  raekkefoelge = billeder.map((_, i) => i);

  for (let i = raekkefoelge.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [raekkefoelge[i], raekkefoelge[j]] =
    [raekkefoelge[j], raekkefoelge[i]];
  }

  aktuel = 0;
  visteBilleder = new Set();
}

let slideshowTimer;
let tilbageTimer;
let pauseTimer;
let erPaaPause = false;

const SKIFT_TID = 5000;
const TILBAGE_TID = 10000;

function visBillede() {
  const fil = billeder[raekkefoelge[aktuel]];

  visteBilleder.add(raekkefoelge[aktuel]);

  const billedmappe =
    "https://raw.githubusercontent.com/anna262f-alt/infoskaerm/main/k%C3%A6ledyrsbilleder/";

  const foto = document.getElementById("foto");

  foto.src = billedmappe + encodeURIComponent(fil);

  let navn = fil.replace(/\.(jpeg|jpg|png)$/i, "");
  navn = navn.replace(/[_\s-]*\d+$/, "");
  navn = navn.replace(/_/g, " ");
  navn = navn.trim().replace(/\s+/g, " ");

  if (!navn.includes(" - ") && !navn.includes(" – ")) {
    navn = navn.replace(" ", " - ");
  }

  navn = navn.replace(/\s*[-–]\s*/, " – ");

  document.getElementById("billedtekst").textContent = navn;

  document.getElementById("nummer").textContent =
    (aktuel + 1) + " / " + billeder.length;
}

// Næste billede
function naeste() {
  aktuel = (aktuel + 1) % billeder.length;
  visBillede();
}

// Forrige billede
function forrige() {
  aktuel = (aktuel - 1 + billeder.length) % billeder.length;
  visBillede();
}

// Brugeren vælger at blive
function blivPaaSiden() {
  clearTimeout(tilbageTimer);
  clearTimeout(pauseTimer);

  erPaaPause = false;

  const knap = document.getElementById("pauseKnap");
  knap.disabled = false;
  knap.textContent = "⏸ Pause";

  document.getElementById("inaktivOverlay").classList.remove("vis");

  blandBilleder();
  visBillede();
  startSlideshow();
}

// Pause slideshow i 10 sekunder
function pauseSlideshow() {

  const knap = document.getElementById("pauseKnap");

  // Hvis slideshowet er på pause
  if (erPaaPause) {

    clearTimeout(pauseTimer);

    erPaaPause = false;

    knap.disabled = false;
    knap.textContent = "⏸ Pause";

    startSlideshow();

    return;
  }

  // Sæt slideshow på pause
  erPaaPause = true;

  clearTimeout(slideshowTimer);

  knap.textContent = "▶ Fortsæt";

  pauseTimer = setTimeout(function() {

    erPaaPause = false;

    knap.textContent = "⏸ Pause";

    startSlideshow();

  }, 10000);
}

// Automatisk slideshow
function startSlideshow() {

  if (erPaaPause) return;

  clearTimeout(slideshowTimer);

  slideshowTimer = setTimeout(function() {

    if (visteBilleder.size === billeder.length) {
      visInaktivBesked();
      return;
    }

    naeste();
    startSlideshow();

  }, SKIFT_TID);
}

// Vis inaktivitetsvinduet
function visInaktivBesked() {

  clearTimeout(slideshowTimer);

  const overlay = document.getElementById("inaktivOverlay");
  overlay.classList.add("vis");

  const streg = overlay.querySelector(".inaktiv-streg-indhold");

  streg.style.animation = "none";
  void streg.offsetWidth;
  streg.style.animation = "inaktivNedtaelling 10s linear forwards";

  tilbageTimer = setTimeout(function() {
    window.location.href = "index.html";
  }, TILBAGE_TID);
}

// Start slideshow i tilfældig rækkefølge
blandBilleder();
visBillede();
startSlideshow();
</script>

</body>
</html>

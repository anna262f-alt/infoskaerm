
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find vej</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f6f9;
      color: #243447;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .medarbejdere {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 220px));
      justify-content: center;
      gap: 24px;
      margin-top: 30px;
    }

    .medarbejder {
      display: block;
      padding: 15px;
      background: white;
      border-radius: 16px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 3px 10px #00000015;
    }

    .medarbejder img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
    }

    .medarbejder h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .tilbage {
      display: inline-block;
      margin-top: 25px;
      color: #145da0;
    }
  </style>
</head>
<body>

  <h1>Hvem vil du finde?</h1>
  <p>Tryk på et billede for at se vej til medarbejderen.</p>

  <div class="medarbejdere">

    <a class="medarbejder" href="anna.html">
      <img src="billeder/medarbejder1.jpg"
           alt="Billede af Anna">
      <h2>Anna</h2>
    </a>

    <a class="medarbejder" href="peter.html">
      <img src="billeder/medarbejder2.jpg"
           alt="Billede af Peter">
      <h2>Peter</h2>
    </a>

  </div>

  <a class="tilbage" href="index.html">← Tilbage til forsiden</a>

</body>
</html>


<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find vej – Medarbejdere</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f3f8f8;
      color: #243b40;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .intro {
      text-align: center;
      margin-bottom: 28px;
    }

    .employees {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .employee {
      display: block;
      padding: 14px;
      background: white;
      border-radius: 14px;
      border: 1px solid #d5e3e5;
      text-align: center;
      color: inherit;
      text-decoration: none;
    }

    .employee img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #e5eeee;
    }

    .employee strong {
      display: block;
      margin-top: 12px;
      font-size: 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #087e83;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="back" href="index.html">← Tilbage til forsiden</a>

    <h1>🧭 Find vej</h1>
    <p class="intro">
      Tryk på billedet af den medarbejder, du vil finde.
    </p>

    <div class="employees">
      <a class="employee" href="#video-1">
        <img src="https://placehold.co/400x400?text=Medarbejder+1"
             alt="Billede af medarbejder 1">
        <strong>Medarbejder 1</strong>
      </a>

      <a class="employee" href="#video-2">
        <img src="https://placehold.co/400x400?text=Medarbejder+2"
             alt="Billede af medarbejder 2">
        <strong>Medarbejder 2</strong>
      </a>
    </div>

    <p class="intro" style="margin-top: 28px;">
      Videoerne bliver tilføjet, når de er optaget.
    </p>
  </main>
</body>
</html>

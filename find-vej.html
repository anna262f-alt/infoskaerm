  <style>
    body {

      margin: 0;
      padding: 24px;
      background: #f3f6f9;
      color: #243447;
      text-align: center;
    }

    .medarbejdere {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 220px));
      justify-content: center;
      gap: 20px;
      margin: 30px auto;
    }

    .medarbejder {
      display: block;
      background: white;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 10px #00000015;
    }

    .medarbejder img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
    }

    .medarbejder h2 {
      font-size: 18px;
    }

    .tilbage {
      display: inline-block;
      margin: 20px;
    }
  </style>
</head>

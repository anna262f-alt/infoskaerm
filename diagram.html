
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fritidsaktiviteter</title>
<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>
body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: #323D4F;
  color: white;
}

h1 { text-align: center; }

#diagram {
  width: 100%;
  height: 650px;
  background: white;
  border-radius: 12px;
  padding: 10px;
  box-sizing: border-box;
}

#popup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(85%, 480px);
  max-height: 75vh;
  overflow-y: auto;
  background: white;
  color: #323D4F;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 5px 25px #0008;
  z-index: 10;
}

#popup h2 { margin-top: 0; }

#luk {
  float: right;
  cursor: pointer;
  font-size: 24px;
  border: none;
  background: none;
}

.person, .valg-felt {
  padding: 10px;
  margin: 6px 0;
  background: #edf1f5;
  border-radius: 6px;
}

.valg-felt h3 {
  margin: 0 0 8px;
  color: #007f7a;
}

.valg-antal {
  font-weight: bold;
  margin-bottom: 6px;
}

.personer {
  font-size: 14px;
  line-height: 1.6;
}

.tilbage {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 20px;
  background: #00A09A;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}
/* Automatisk tilbagefunktion */

.inaktiv-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.75);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.inaktiv-overlay.vis {
  display: flex;
}

.inaktiv-vindue {
  position: relative;
  width: 90%;
  max-width: 500px;
  padding: 35px 25px 45px;
  background: var(--panel, #394658);
  border: 2px solid var(--turquoise, #00A09A);
  border-radius: 18px;
  text-align: center;
  color: var(--turquoise, #00A09A);
  overflow: hidden;
}

.inaktiv-vindue h2 {
  margin-top: 0;
  font-size: 25px;
}

.inaktiv-vindue p {
  font-size: 17px;
  line-height: 1.5;
}

.inaktiv-knap {
  margin-top: 15px;
  padding: 14px 22px;
  border: none;
  border-radius: 10px;
  background: var(--turquoise, #00A09A);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.inaktiv-streg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,0.2);
}

.inaktiv-streg-indhold {
  width: 100%;
  height: 100%;
  background: var(--turquoise, #00A09A);
  transform-origin: left;
}

.inaktiv-overlay.vis .inaktiv-streg-indhold {
  animation: inaktivNedtaelling 10s linear forwards;
}

@keyframes inaktivNedtaelling {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}
</style>
</head>

<body>

<h1>Hvad laver folk i deres fritid?</h1>
<div id="diagram">Henter diagram ...</div>

<div id="popup">
  <button id="luk" onclick="lukPopup()">×</button>
  <h2 id="popupTitel"></h2>
  <div id="popupIndhold"></div>
</div>

<a class="tilbage" href="index.html">← Tilbage til forsiden</a>

<script>
const API = "https://script.google.com/macros/s/AKfycbylNU5Ccc5CCL_Jnjhya2iC_wmOLIcqxxiVXjoR8dlKoEUEz_AhIUuqwlA5-2zyPrLM/exec";

let alleData = [];

google.charts.load("current", { packages: ["corechart"] });
google.charts.setOnLoadCallback(hentData);

function hentData() {
  window.modtagData = function(data) {
    alleData = data.aktiviteter || [];
    tegnDiagram();
  };

  const script = document.createElement("script");
  script.src = API + "?callback=modtagData&t=" + Date.now();

  script.onerror = function() {
    document.getElementById("diagram").innerText =
      "Diagrammet kunne ikke hentes. Prøv igen.";
  };

  document.body.appendChild(script);
}

function tegnDiagram() {
  const data = new google.visualization.DataTable();
  data.addColumn("string", "Aktivitet");
  data.addColumn("number", "Antal svar");

  alleData.forEach(item => {
    data.addRow([item.navn, Number(item.antal) || 0]);
  });

  const diagram = new google.visualization.BarChart(
    document.getElementById("diagram")
  );

  google.visualization.events.addListener(diagram, "select", function() {
    const valg = diagram.getSelection();
    if (valg.length > 0) {
      visPopup(alleData[valg[0].row]);
    }
  });

  diagram.draw(data, {
    title: "Tryk på en søjle for at se andre svar og hvem der har svaret",
    legend: { position: "none" },
    colors: ["#00A09A"],
    backgroundColor: "white",
    chartArea: {
      left: 175,
      right: 30,
      top: 50,
      bottom: 50,
      width: "75%",
      height: "80%"
    },
    hAxis: {
      minValue: 0,
      format: "0",
      title: "Antal svar"
    },
    vAxis: { textStyle: { fontSize: 12 } },
    height: 630
  });
}

function visPopup(item) {
  document.getElementById("popupTitel").innerText =
    item.navn + " – " + item.antal + " svar";

  const indhold = document.getElementById("popupIndhold");
  indhold.innerHTML = "";

  if (item.valgmuligheder && item.valgmuligheder.length) {
    item.valgmuligheder.forEach(valg => {
      const felt = document.createElement("div");
      felt.className = "valg-felt";

      const titel = document.createElement("h3");
      titel.textContent = valg.navn;

      const antal = document.createElement("div");
      antal.className = "valg-antal";
      antal.textContent = valg.antal + " svar";

      const personer = document.createElement("div");
      personer.className = "personer";

      const navne = valg.personer || [];
      personer.textContent = navne.length
        ? "Navne: " + navne.join(", ")
        : "Ingen navne oplyst.";

      felt.appendChild(titel);
      felt.appendChild(antal);
      felt.appendChild(personer);
      indhold.appendChild(felt);
    });
  } else {
    const antal = document.createElement("div");
    antal.className = "valg-antal";
    antal.textContent = item.antal + " svar";
    indhold.appendChild(antal);

    const personer = document.createElement("div");
    personer.className = "personer";
    personer.textContent = item.personer && item.personer.length
      ? "Navne: " + item.personer.join(", ")
      : "Ingen navne oplyst.";

    indhold.appendChild(personer);
  }

  document.getElementById("popup").style.display = "block";
}

function lukPopup() {
  document.getElementById("popup").style.display = "none";
}

window.addEventListener("resize", () => {
  if (alleData.length) tegnDiagram();
});

setInterval(hentData, 60000);
</script>
<!-- Automatisk tilbagefunktion -->

<div class="inaktiv-overlay" id="inaktivOverlay">
  <div class="inaktiv-vindue">

    <h2>Er du her stadig?</h2>

    <p>
      Hvis du vil blive på siden, skal du trykke på knappen nedenfor.
      Ellers vender skærmen automatisk tilbage til forsiden.
    </p>

    <button class="inaktiv-knap"
      onclick="blivPaaSiden()">
      Jeg vil blive på siden
    </button>

    <div class="inaktiv-streg">
      <div class="inaktiv-streg-indhold"></div>
    </div>

  </div>
</div>

<script>
let inaktivTimer;
let tilbageTimer;

const INAKTIV_TID = 60 * 1000;
const TILBAGE_TID = 10 * 1000;

function startInaktivTimer() {
  clearTimeout(inaktivTimer);

  inaktivTimer = setTimeout(visInaktivBesked, INAKTIV_TID);
}

function visInaktivBesked() {
  const overlay = document.getElementById("inaktivOverlay");

  overlay.classList.add("vis");

  const streg = overlay.querySelector(".inaktiv-streg-indhold");

  // Genstart stregens animation
  streg.style.animation = "none";
  void streg.offsetWidth;
  streg.style.animation = "inaktivNedtaelling 10s linear forwards";

  tilbageTimer = setTimeout(function() {
    window.location.href = "index.html";
  }, TILBAGE_TID);
}

function blivPaaSiden() {
  clearTimeout(tilbageTimer);

  document.getElementById("inaktivOverlay").classList.remove("vis");

  startInaktivTimer();
}

// Aktivitet på skærmen nulstiller minuttet
["pointerdown", "keydown", "wheel"].forEach(function(hændelse) {
  document.addEventListener(hændelse, function() {
    if (!document.getElementById("inaktivOverlay").classList.contains("vis")) {
      startInaktivTimer();
    }
  }, { passive: true });
});

// Start automatisk
startInaktivTimer();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find vej til Frederik</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      background: #f3f6f9;
      color: #243447;
    }

    .videofelt {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-top: 24px;
      box-shadow: 0 3px 10px #00000015;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
    }

    .tilbage {
      display: inline-block;
      margin-top: 24px;
    }

    /* Automatisk tilbagefunktion */

.inaktiv-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.75);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.inaktiv-overlay.vis {
  display: flex;
}

.inaktiv-vindue {
  position: relative;
  width: 90%;
  max-width: 500px;
  padding: 35px 25px 45px;
  background: #394658;
  border: 2px solid #00A09A;
  border-radius: 18px;
  text-align: center;
  color: #00A09A;
  overflow: hidden;
}

.inaktiv-vindue h2 {
  margin-top: 0;
  font-size: 25px;
}

.inaktiv-vindue p {
  font-size: 17px;
  line-height: 1.5;
}

.inaktiv-knap {
  margin-top: 15px;
  padding: 14px 22px;
  border: none;
  border-radius: 10px;
  background: #00A09A;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.inaktiv-streg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,0.2);
}

.inaktiv-streg-indhold {
  width: 100%;
  height: 100%;
  background: #00A09A;
  transform-origin: left;
}

@keyframes inaktivNedtaelling {
  from { transform: scaleX(1); }
  to { transform: scaleX(0); }
}
    
  </style>
</head>

<body>

  <h1>Find vej til Frederik</h1>

  <div class="videofelt">
    <video autoplay muted playsinline controls>
      <source src="videoer/frederik.mp4" type="video/mp4">
    </video>

  </div>

  <a class="tilbage" href="find-vej.html">
    ← Tilbage til medarbejderne
  </a>

  <br>
  
  <a class="tilbage" href="index.html">
    ← Tilbage til forsiden
  </a>
<!-- Automatisk tilbagefunktion -->

<div class="inaktiv-overlay" id="inaktivOverlay">
  <div class="inaktiv-vindue">

    <h2>Er du her stadig?</h2>

    <p>
      Hvis du vil blive på siden, skal du trykke på knappen nedenfor.
      Ellers vender skærmen automatisk tilbage til forsiden.
    </p>

    <button class="inaktiv-knap"
      onclick="blivPaaSiden()">
      Jeg vil blive på siden
    </button>

    <div class="inaktiv-streg">
      <div class="inaktiv-streg-indhold"></div>
    </div>

  </div>
</div>

<script>
let inaktivTimer;
let tilbageTimer;

const INAKTIV_TID = 60 * 1000;
const TILBAGE_TID = 10 * 1000;

function startInaktivTimer() {
  clearTimeout(inaktivTimer);

  inaktivTimer = setTimeout(visInaktivBesked, INAKTIV_TID);
}

function visInaktivBesked() {
  const overlay = document.getElementById("inaktivOverlay");

  overlay.classList.add("vis");

  const streg = overlay.querySelector(".inaktiv-streg-indhold");

  // Genstart stregens animation
  streg.style.animation = "none";
  void streg.offsetWidth;
  streg.style.animation = "inaktivNedtaelling 10s linear forwards";

  tilbageTimer = setTimeout(function() {
    window.location.href = "index.html";
  }, TILBAGE_TID);
}

function blivPaaSiden() {
  clearTimeout(tilbageTimer);

  document.getElementById("inaktivOverlay").classList.remove("vis");

  startInaktivTimer();
}

// Aktivitet på skærmen nulstiller minuttet
["pointerdown", "keydown", "wheel"].forEach(function(hændelse) {
  document.addEventListener(hændelse, function() {
    if (!document.getElementById("inaktivOverlay").classList.contains("vis")) {
      startInaktivTimer();
    }
  }, { passive: true });
});

// Start automatisk
startInaktivTimer();
</script>
  
</body>
</html>
